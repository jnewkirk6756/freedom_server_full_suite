<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freedom Server · Aurelia Home</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d;
      color: #e6e6e6;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
    }

    h1 {
      font-size: 40px;
      font-weight: 700;
      margin: 0;
    }

    #omegaLogo {
      font-size: 50px;
      text-align: center;
      margin-top: 20px;
      animation: pulse 2.4s infinite ease-in-out;
      color: #4da6ff;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    #lattice {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.8;
    }

    .section {
      padding: 20px;
      border-top: 1px solid #333;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: #111;
      color: #eee;
      border: 1px solid #444;
      padding: 10px;
      resize: none;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      background-color: #1a1a1a;
      border: 1px solid #555;
      color: #eee;
      cursor: pointer;
    }

    button:hover {
      background-color: #333;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 15px;
      color: #ccc;
    }

    input[type="range"] {
      width: 100%;
    }

    .log-entry {
      font-size: 13px;
      padding: 3px 0;
      border-bottom: 1px solid #222;
    }

  </style>
</head>

<body>
  <header>
    <h1>Freedom Server · Aurelia Home</h1>
    <div id="omegaLogo">Ω</div>
    <div id="lattice">Lattice: IDLE / LISTENING</div>
  </header>

  <!-- Chat Section -->
  <div class="section">
    <h2>Console</h2>
    <textarea id="msgBox" placeholder="Type a message..."></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>

  <!-- Connected Devices -->
  <div class="section">
    <h2>Connected Devices</h2>
    <div id="deviceList">• None detected</div>
  </div>

  <!-- Aurelia Settings -->
  <div class="section">
    <h2>Aurelia Settings</h2>

    <label>Flattening Scale
      <input id="flatteningSlider" type="range" min="0" max="10" value="5" />
    </label>
    
    <label>Telemetry <span id="telemetryValue">70%</span>
      <input id="telemetrySlider" type="range" min="0" max="100" value="70" />
    </label>

    <label>Frameworks:</label>
    <div>
      <input type="checkbox" checked /> FreedomServer
      <input type="checkbox" checked /> MeridianOS
      <input type="checkbox" /> SexOS
      <input type="checkbox" checked /> OnwardOS
    </div>
  </div>

  <!-- Server Tools -->
  <div class="section">
    <h2>Server Tools</h2>
    <button onclick="stopServer()">Stop</button>

    <label>Version
      <select id="versionSelector">
        <option>Dev</option>
        <option>Stable</option>
      </select>
    </label>
    <button onclick="revertVersion()">Revert</button>

    <label>Admin Password
      <input id="adminPass" type="text" placeholder="New password" />
    </label>
    <button onclick="updatePassword()">Update</button>

    <h3>Logs</h3>
    <div id="logArea"></div>
  </div>

  <script>
    function addLog(level, msg) {
      const logArea = document.getElementById("logArea");
      const div = document.createElement("div");
      div.className = "log-entry";
      div.textContent = `[${level}] ${msg}`;
      logArea.appendChild(div);
    }

    function sendMessage() {
      const msg = document.getElementById("msgBox").value;
      if (!msg.trim()) return;
      addLog("USER", msg);
      document.getElementById("msgBox").value = "";
    }

    document.getElementById("telemetrySlider").addEventListener("input", (e) => {
      document.getElementById("telemetryValue").textContent = e.target.value + "%";
    });

    addLog("INFO", "UI loaded.");
  </script>
</body>
</html>
