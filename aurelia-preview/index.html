<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090812">
<title>Aurelia Beta Launcher</title>
<style>
:root{--bg:#08080f;--p:#151321;--l:#ffffff16;--t:#f7f5ff;--m:#9d98ad;--v:#9c6cff;--g:#8fe0b4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#08080f;color:var(--t)}
body{background:radial-gradient(circle at 15% -10%,#7b4ae050,transparent 32rem),radial-gradient(circle at 95% 10%,#4068ad30,transparent 26rem),linear-gradient(#10101a,#08080f)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{padding:22px 16px;border-right:1px solid var(--l);background:#08080fcf}.brand{display:flex;gap:10px;align-items:center;margin:0 6px 26px}.mark{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#b18bff,#5b35b9);font-weight:900;box-shadow:0 0 28px #9c6cff42}.brand b{letter-spacing:.14em;font-size:13px}.brand small{display:block;color:var(--m);font-size:9px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#aaa6b8;padding:12px;border-radius:12px;text-align:left;font-weight:750}.nav button.on{background:#9c6cff1e;color:#fff}.main{padding:28px clamp(16px,4vw,48px) 50px}.top{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px}.ey{color:#bea7ff;text-transform:uppercase;letter-spacing:.15em;font-size:10px;font-weight:900}h1{font-size:clamp(30px,4.4vw,50px);line-height:1.02;letter-spacing:-.04em;margin:6px 0 8px}h2{font-size:18px;margin:0}.muted{color:var(--m);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.s8{grid-column:span 8}.s4{grid-column:span 4}.s12{grid-column:span 12}.card{border:1px solid var(--l);border-radius:20px;padding:20px;background:linear-gradient(#191824e8,#0e0e16e8);box-shadow:0 25px 70px #0006}.glow{border-color:#9c6cff50;background:linear-gradient(145deg,#2d1e49e8,#0f0e18f2)}.hero{min-height:285px;display:flex;align-items:end;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-70px;border:1px solid #c2abff22;box-shadow:inset 0 0 100px #6d45d826}.copy{position:relative;z-index:2;max-width:620px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;border:1px solid var(--l);font-size:10px;font-weight:800;color:#d8c9ff}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850}.pri{background:linear-gradient(135deg,#a579ff,#7448d6);color:#fff}.sec{background:#1a1924;color:#fff;border:1px solid var(--l)}.actions{display:flex;gap:9px;flex-wrap:wrap}.stat{font-size:38px;font-weight:900;letter-spacing:-.05em}.label{font-size:11px;color:var(--m)}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--l)}.row:first-child{border-top:0}label{display:block;font-size:11px;color:#aaa6b8;margin:13px 0 6px;font-weight:800}input,textarea,select{width:100%;border:1px solid var(--l);border-radius:12px;background:#0e0e16;color:#fff;padding:12px;outline:none}textarea{min-height:100px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:20px}.step{text-align:center;color:#6f6b7c;font-size:9px}.step i{font-style:normal;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;margin:auto auto 5px;border:1px solid var(--l)}.step.on{color:#fff}.step.on i{background:#8e5cf1;border-color:transparent}.orbbox{min-height:360px;border:1px solid var(--l);border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle,#7048d62d,transparent 45%),#0c0b13}.orb{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#c29fff,#754adc 30%,#171222 68%);box-shadow:0 0 90px #9c6cff55;font-size:54px}.vr .side,.vr .top{display:none}.vr .shell{display:block}.vr .main{padding:24px}.vr .orbbox{min-height:75vh}.bottom{display:none}
@media(max-width:900px){.shell{grid-template-columns:78px 1fr}.brand span,.nav span{display:none}.nav button{text-align:center;font-size:18px}.s8,.s4{grid-column:span 12}}
@media(max-width:650px){.shell{display:block}.side{display:none}.main{padding:18px 14px 86px}.form{grid-template-columns:1fr}.bottom{display:grid;position:fixed;left:10px;right:10px;bottom:10px;grid-template-columns:repeat(5,1fr);padding:6px;border:1px solid var(--l);border-radius:18px;background:#111019ed;z-index:20}.bottom button{border:0;background:transparent;color:#8d899b;padding:9px 1px;border-radius:10px;font-size:9px}.bottom button.on{color:#fff;background:#9c6cff1d}}
</style>
</head>
<body><div id="app"></div>
<script>
const S={page:'home',step:0,credits:200,vr:new URLSearchParams(location.search).get('vr')==='1',
avatar:JSON.parse(localStorage.getItem('aurelia.launch.avatar')||'null'),
draft:JSON.parse(localStorage.getItem('aurelia.launch.draft')||'null')||{name:'',age:18,look:'',hair:'',eyes:'',personality:'warm, intelligent, direct',cadence:'',voice:'warm',tier:'essential'}};
const A=document.querySelector('#app'),N=[['home','◇','Home'],['create','✦','Create'],['runtime','◌','Runtime'],['library','▣','Library'],['account','○','Account']];
const e=x=>String(x||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function save(){localStorage.setItem('aurelia.launch.draft',JSON.stringify(S.draft));if(S.avatar)localStorage.setItem('aurelia.launch.avatar',JSON.stringify(S.avatar))}
function layout(body,title,sub){return '<div class="shell"><aside class="side"><div class="brand"><div class="mark">A</div><span><b>AURELIA</b><small>Beta Launcher</small></span></div><div class="nav">'+N.map(x=>'<button data-nav="'+x[0]+'" class="'+(S.page===x[0]?'on':'')+'">'+x[1]+' <span>'+x[2]+'</span></button>').join('')+'</div></aside><main class="main"><div class="top"><div><div class="ey">'+sub+'</div><h1>'+title+'</h1></div><span class="badge">PRIVATE BETA</span></div>'+body+'</main><nav class="bottom">'+N.map(x=>'<button data-nav="'+x[0]+'" class="'+(S.page===x[0]?'on':'')+'">'+x[1]+'<br>'+x[2]+'</button>').join('')+'</nav></div>'}
function home(){return layout('<div class="grid"><section class="card glow hero s8"><div class="copy"><span class="badge">'+(S.avatar?'CHARACTER PACKAGE READY':'SELF-SERVICE PREVIEW')+'</span><h1>'+(S.avatar?e(S.avatar.name):'Create a presence.<br>Build a world.')+'</h1><p class="muted">'+(S.avatar?'Your avatar exists in this launcher. Production will sync the same identity across phone, computer and VR.':'Nothing is pre-populated. Build the avatar through the client, then use the runtime and VR launcher.')+'</p><div class="actions"><button class="btn pri" data-nav="'+(S.avatar?'runtime':'create')+'">'+(S.avatar?'Enter runtime':'Create avatar')+'</button><button class="btn sec" id="vr">VR Launcher</button></div></div></section><section class="card s4"><h2>Wallet</h2><div class="stat">'+S.credits+'</div><div class="label">beta credits</div><div class="row"><span>Avatar slots</span><b>'+(S.avatar?'1':'0')+' / 4</b></div><div class="row"><span>Storage</span><b>Local preview</b></div></section><section class="card s4"><h2>Performance</h2><div class="stat">Anti-repeat</div><div class="label">transition-aware runtime</div><p class="muted">Designed to avoid obvious repeated loops.</p></section><section class="card s4"><h2>Cross-device</h2><div class="stat">1 ID</div><div class="label">phone · desktop · VR</div><p class="muted">Production cloud becomes canonical; each device caches only what it needs.</p></section><section class="card s4"><h2>Adult eligibility</h2><div class="stat">18+</div><div class="label">hard avatar floor</div><p class="muted">Account verification and avatar age are separate enforcement layers.</p></section></div>','Your companion, everywhere.','Persistent AI Avatar Platform')}
function steps(){let a=['Identity','Appearance','Personality','Cadence','Commission'];return '<div class="steps">'+a.map((x,i)=>'<div class="step '+(i===S.step?'on':'')+'"><i>'+(i+1)+'</i>'+x+'</div>').join('')+'</div>'}
function create(){let d=S.draft,b='';if(S.step===0)b='<h2>Start with who they are.</h2><div class="form"><div><label>Name</label><input id="name" value="'+e(d.name)+'"></div><div><label>Age</label><input id="age" type="number" min="18" value="'+d.age+'"></div></div><p class="muted">Avatar age cannot be lower than 18.</p>';if(S.step===1)b='<h2>Design the visual identity.</h2><label>Overall appearance</label><textarea id="look">'+e(d.look)+'</textarea><div class="form"><div><label>Hair</label><input id="hair" value="'+e(d.hair)+'"></div><div><label>Eyes</label><input id="eyes" value="'+e(d.eyes)+'"></div></div>';if(S.step===2)b='<h2>Build the personality.</h2><label>Personality direction</label><textarea id="personality">'+e(d.personality)+'</textarea><p class="muted">Production uses structured personality traits plus memory, not one giant prompt.</p>';if(S.step===3)b='<h2>Shape the cadence.</h2><label>Optional authorized writing excerpt</label><textarea id="cadence">'+e(d.cadence)+'</textarea><p class="muted">Only use writing you have the right to use.</p>';if(S.step===4)b='<h2>Commission the first performance blueprint.</h2><div class="form">'+[['essential','Essential · 120 credits'],['presence','Presence · 420 credits'],['immersive','Immersive · 900 credits']].map(x=>'<button class="btn '+(d.tier===x[0]?'pri':'sec')+'" data-tier="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><p class="muted">This launcher creates the package locally; it does not pretend cloud media has already been generated.</p>';return layout('<section class="card s12">'+steps()+b+'<div class="actions" style="justify-content:space-between;margin-top:20px"><button class="btn sec" id="back" '+(S.step===0?'disabled':'')+'>← Back</button><button class="btn pri" id="'+(S.step===4?'commission':'next')+'">'+(S.step===4?'Commission package':'Continue →')+'</button></div></section>','Avatar Creator','Official Client · Self-Service')}
function runtime(){if(!S.avatar)return layout('<section class="card glow"><h2>Create an avatar first.</h2><p class="muted">The runtime stays empty until the user builds the character through the client.</p><button class="btn pri" data-nav="create">Open Creator</button></section>','Performance Runtime','Continuity Engine');return layout('<div class="grid"><section class="card glow s8"><h2>'+e(S.avatar.name)+' · Presence Runtime</h2><div class="orbbox"><div class="orb">A</div></div><div class="actions" style="margin-top:12px"><button class="btn sec">Listening</button><button class="btn sec">Speaking</button><button class="btn sec">Thinking</button><button class="btn sec">Warm</button></div></section><section class="card s4"><h2>Runtime state</h2><div class="stat">Ready</div><div class="label">local-first engine</div><div class="row"><span>Tier</span><b>'+e(S.avatar.tier)+'</b></div><div class="row"><span>Media</span><b>Not generated</b></div><div class="row"><span>VR pack</span><b>Planned</b></div></section></div>','Performance Runtime','Continuity · Anti-Repeat')}
function library(){return layout('<div class="grid"><section class="card s8"><h2>Your library</h2>'+(S.avatar?'<div class="row"><span>'+e(S.avatar.name)+'</span><b>'+e(S.avatar.tier)+'</b></div><div class="row"><span>Performance Pack</span><b>Planned</b></div><div class="row"><span>VR Pack</span><b>Planned</b></div>':'<p class="muted">Commission an avatar to populate the library.</p>')+'</section><section class="card s4"><h2>Storage model</h2><p class="muted">Cloud is canonical. Phone, desktop and headset keep optimized local caches.</p><div class="row"><span>Cloud</span><b>Master</b></div><div class="row"><span>Device</span><b>Cache</b></div></section></div>','Library','Cloud Canonical · Device Cache')}
function account(){return layout('<div class="grid"><section class="card s8"><h2>Beta account</h2><p class="muted">Launcher preview uses device-local data. Production authentication will carry one account across all clients.</p><div class="row"><span>Avatar age floor</span><b>18+</b></div><div class="row"><span>Maximum slots</span><b>4</b></div><div class="row"><span>Credits</span><b>'+S.credits+'</b></div></section><section class="card s4"><h2>Security</h2><p class="muted">Production: server identity, private cloud assets, signed access, audited credits, account recovery.</p></section></div>','Account','Private Beta')}
function vr(){document.body.classList.add('vr');A.innerHTML='<main class="main"><div class="grid"><section class="card glow s4"><div class="ey">Quest / VR Launcher</div><h1>'+(S.avatar?e(S.avatar.name):'Aurelia Platform')+'</h1><p class="muted">Bookmark this launcher URL on the headset. Production VR will log into the same account and pull only VR-compatible assets.</p><div class="actions"><button class="btn pri" id="exitvr">Exit VR preview</button></div></section><section class="orbbox s8"><div class="orb">A</div></section></div></main>';document.querySelector('#exitvr').onclick=()=>{S.vr=false;history.replaceState({},'',location.pathname);document.body.classList.remove('vr');render()}}
function capture(){if(S.step===0){S.draft.name=document.querySelector('#name').value.trim();S.draft.age=Number(document.querySelector('#age').value);if(!S.draft.name)throw Error('Add a name.');if(S.draft.age<18)throw Error('Avatar age must be 18 or older.')}if(S.step===1){S.draft.look=document.querySelector('#look').value;S.draft.hair=document.querySelector('#hair').value;S.draft.eyes=document.querySelector('#eyes').value}if(S.step===2)S.draft.personality=document.querySelector('#personality').value;if(S.step===3)S.draft.cadence=document.querySelector('#cadence').value;save()}
function bind(){document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>{S.page=x.dataset.nav;render()});document.querySelector('#vr')?.addEventListener('click',()=>{S.vr=true;history.replaceState({},'',location.pathname+'?vr=1');render()});document.querySelector('#next')?.addEventListener('click',()=>{try{capture();S.step++;render()}catch(e){alert(e.message)}});document.querySelector('#back')?.addEventListener('click',()=>{try{capture()}catch{}S.step--;render()});document.querySelectorAll('[data-tier]').forEach(x=>x.onclick=()=>{S.draft.tier=x.dataset.tier;save();render()});document.querySelector('#commission')?.addEventListener('click',()=>{try{capture();let c={essential:120,presence:420,immersive:900}[S.draft.tier];if(S.credits<c)throw Error('Not enough preview credits for this tier.');S.credits-=c;S.avatar={name:S.draft.name,age:S.draft.age,tier:S.draft.tier};save();S.page='home';render()}catch(e){alert(e.message)}})}
function render(){if(S.vr)return vr();document.body.classList.remove('vr');A.innerHTML=S.page==='create'?create():S.page==='runtime'?runtime():S.page==='library'?library():S.page==='account'?account():home();bind()}render();
</script></body></html>
