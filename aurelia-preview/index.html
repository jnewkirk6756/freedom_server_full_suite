<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090812">
<title>Aurelia Beta Launcher</title>
<style>
:root{
  --bg:#08080f;--panel:rgba(18,17,28,.78);--panel2:rgba(11,11,18,.92);
  --line:rgba(255,255,255,.085);--text:#f7f5ff;--muted:#9d98ad;
  --violet:#9c6cff;--violet2:#6d45d8;--cyan:#79d7ff;--green:#8fe0b4;
  --amber:#ffd37d;--red:#ff8f9d;--shadow:0 28px 80px rgba(0,0,0,.38);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:
radial-gradient(circle at 14% -10%,rgba(120,72,230,.35),transparent 33rem),
radial-gradient(circle at 96% 10%,rgba(58,110,190,.18),transparent 28rem),
linear-gradient(180deg,#10101a 0,#08080f 72%);overflow-x:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}
a{color:inherit}
.shell{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);background:rgba(7,7,12,.75);backdrop-filter:blur(18px);z-index:20}
.brand{display:flex;align-items:center;gap:11px;margin:2px 8px 28px}.brandmark{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#ac81ff,#5a39bc);box-shadow:0 0 30px rgba(156,108,255,.28);font-weight:900}.brand strong{display:block;letter-spacing:.13em;font-size:13px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#aaa6b8;padding:12px;border-radius:12px;text-align:left;font-weight:700}.nav button:hover,.nav button.active{background:rgba(156,108,255,.11);color:#fff;box-shadow:inset 0 0 0 1px rgba(156,108,255,.16)}
.sidebar-foot{position:absolute;left:18px;right:18px;bottom:20px}.devtag{padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#0e0e16;color:var(--muted);font-size:11px}.devtag b{color:var(--green)}
.main{padding:28px clamp(18px,4vw,52px) 56px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:#b99fff;font-size:10px;font-weight:850}h1{font-size:clamp(29px,4.3vw,48px);line-height:1.02;letter-spacing:-.035em;margin:6px 0 8px}h2{font-size:18px;margin:0}h3{font-size:14px;margin:0}p{line-height:1.55}.muted{color:var(--muted)}.small{font-size:12px}
.userpill{display:flex;align-items:center;gap:9px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:999px;background:rgba(16,15,24,.84)}.userpill .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#9c6cff,#39216f);font-weight:850;font-size:12px}.userpill span{font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}
.card{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(180deg,rgba(25,24,37,.92),rgba(14,14,22,.88));box-shadow:var(--shadow);overflow:hidden}.glow{border-color:rgba(156,108,255,.31);background:linear-gradient(145deg,rgba(43,29,71,.92),rgba(15,14,24,.94))}
.hero{min-height:290px;position:relative;display:flex;align-items:flex-end}.hero:after{content:"";position:absolute;width:310px;height:310px;right:-80px;top:-95px;border-radius:50%;border:1px solid rgba(194,171,255,.13);box-shadow:0 0 110px rgba(109,69,216,.14) inset}.hero:before{content:"";position:absolute;width:120px;height:120px;right:112px;top:55px;border-radius:50%;background:radial-gradient(circle,#b889ff 0,#7349dc 24%,rgba(36,24,64,.2) 62%,transparent 72%);box-shadow:0 0 65px rgba(156,108,255,.36)}.herocopy{position:relative;z-index:2;max-width:650px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.026);border-radius:999px;padding:6px 9px;color:#c6c2d3;font-size:10px;font-weight:800}.badge.good{color:var(--green);border-color:rgba(143,224,180,.2)}.badge.warn{color:var(--amber);border-color:rgba(255,211,125,.2)}.badge.purple{color:#d8c9ff;border-color:rgba(156,108,255,.28);background:rgba(156,108,255,.08)}
.actions{display:flex;flex-wrap:wrap;gap:9px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850}.btn.primary{color:#fff;background:linear-gradient(135deg,#a579ff,#7448d6);box-shadow:0 12px 30px rgba(116,72,214,.24)}.btn.secondary{color:#f1edf9;background:#1a1924;border:1px solid var(--line)}.btn.ghost{color:#c9c5d5;background:transparent;border:1px solid var(--line)}.btn.full{width:100%}.btn:disabled{opacity:.4;cursor:not-allowed}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.stat{font-size:36px;font-weight:900;letter-spacing:-.045em}.statlabel{color:var(--muted);font-size:11px;margin-top:2px}.list{display:grid}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row strong{display:block}.meta{color:var(--muted);font-size:11px;margin-top:3px}
label{display:block;color:#aaa6b8;font-size:11px;font-weight:800;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);background:#0e0e16;color:#fff;border-radius:12px;padding:12px 13px;outline:none}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:rgba(156,108,255,.65);box-shadow:0 0 0 3px rgba(156,108,255,.1)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.check{display:flex;align-items:flex-start;gap:9px;color:#c7c3d2;font-size:11px;margin-top:13px}.check input{width:auto;margin-top:2px}
.notice{border:1px solid rgba(255,211,125,.18);background:rgba(255,211,125,.06);color:#ead8ac;border-radius:13px;padding:11px 12px;font-size:11px}.success{border:1px solid rgba(143,224,180,.18);background:rgba(143,224,180,.06);color:#b3ebc8;border-radius:13px;padding:11px 12px;font-size:11px}.error{border:1px solid rgba(255,143,157,.18);background:rgba(255,143,157,.07);color:#ffb1bb;border-radius:13px;padding:11px 12px;font-size:11px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto}.step{text-align:center;min-width:86px;color:#6e6b7b}.step i{font-style:normal;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;margin:0 auto 6px;border:1px solid var(--line);background:#11111a;font-size:10px;font-weight:900}.step small{font-size:9px;font-weight:800}.step.active{color:#fff}.step.active i{border-color:transparent;background:linear-gradient(135deg,#a377ff,#7147d0)}.step.done{color:#c4abff}.step.done i{border-color:rgba(156,108,255,.28)}
.traits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.trait{padding:12px;border:1px solid var(--line);border-radius:13px;background:#0e0e16}.traittop{display:flex;justify-content:space-between;font-size:11px;color:#c7c3d2}.trait input{padding:0;margin-top:10px;accent-color:#9c6cff}
.runtimebox{display:grid;place-items:center;min-height:260px;position:relative;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at center,rgba(114,74,214,.18),transparent 42%),#0c0b13}.orb{width:122px;height:122px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#c099ff 0,#7950dc 30%,#191327 68%);box-shadow:0 0 80px rgba(156,108,255,.34);font-size:48px}.wave{position:absolute;left:12%;right:12%;bottom:32px;height:38px;display:flex;align-items:center;justify-content:center;gap:4px}.wave b{display:block;width:3px;border-radius:4px;background:linear-gradient(#b892ff,#5c39b9);animation:pulse 1.25s ease-in-out infinite;opacity:.85}.wave b:nth-child(2n){animation-delay:.12s}.wave b:nth-child(3n){animation-delay:.24s}@keyframes pulse{0%,100%{height:7px;opacity:.35}50%{height:30px;opacity:1}}
.librarygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{min-height:120px;padding:14px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#13121c,#0c0c13);position:relative;overflow:hidden}.tile:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-28px;bottom:-35px;background:rgba(156,108,255,.09)}.tile strong{display:block}.tile span{color:var(--muted);font-size:10px}
.mobilebar{display:none}
.vrmode .sidebar,.vrmode .topbar{display:none}.vrmode .shell{display:block}.vrmode .main{padding:30px}.vrmode .vrhero{min-height:calc(100vh - 60px);display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}.vrmode .orb{width:210px;height:210px;font-size:74px}
.toast{position:fixed;right:18px;bottom:18px;padding:11px 13px;border:1px solid var(--line);background:rgba(18,17,28,.94);border-radius:12px;box-shadow:var(--shadow);z-index:99;color:#ddd9e7;font-size:11px;transform:translateY(20px);opacity:0;transition:.2s}.toast.show{transform:none;opacity:1}
@media(max-width:960px){.shell{grid-template-columns:82px minmax(0,1fr)}.sidebar{padding:22px 11px}.brand span,.nav .label,.devtag{display:none}.nav button{text-align:center;font-size:18px}.span8,.span6,.span4{grid-column:span 12}.librarygrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.shell{display:block}.sidebar{display:none}.main{padding:20px 15px 90px}.userpill span{display:none}.formgrid,.traits{grid-template-columns:1fr}.librarygrid{grid-template-columns:1fr}.mobilebar{display:grid;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr);padding:6px;border:1px solid var(--line);border-radius:18px;background:rgba(16,15,24,.93);backdrop-filter:blur(18px);z-index:50}.mobilebar button{border:0;background:transparent;color:#8c899a;padding:9px 2px;border-radius:11px;font-size:9px;font-weight:800}.mobilebar button.active{color:#fff;background:rgba(156,108,255,.12)}.vrmode .vrhero{grid-template-columns:1fr}.vrmode .main{padding:14px}}

.chatlog{min-height:320px;max-height:48vh;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:16px;background:#0c0b13}
.chatrow{display:flex;margin:8px 0}.chatrow.mine{justify-content:flex-end}.chatbubble{max-width:78%;padding:11px 13px;border:1px solid var(--line);border-radius:15px;background:#171621;line-height:1.5;font-size:13px}.chatrow.mine .chatbubble{background:linear-gradient(135deg,#7548d6,#4b2e90)}.chatbubble small{display:block;color:#a89ebf;margin-bottom:4px;font-size:9px;text-transform:uppercase;letter-spacing:.12em}.chatbubble time{display:block;color:rgba(255,255,255,.35);font-size:9px;margin-top:5px}.chatcompose{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:10px}.chatcompose textarea{min-height:52px}.presencepanel{display:flex;align-items:center;gap:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at 16% 50%,rgba(156,108,255,.2),transparent 16rem),#0d0c15}.presencepanel .orb{width:86px;height:86px;font-size:30px}.freeflag{color:var(--green);font-weight:900}
@media(max-width:680px){.chatbubble{max-width:88%}.chatcompose{grid-template-columns:1fr}.chatcompose .btn{width:100%}}


.mediaimport{display:grid;gap:12px}.mediastage{position:relative;min-height:270px;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:radial-gradient(circle at center,rgba(156,108,255,.18),transparent 18rem),#0b0a12}.mediastage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#08080e}.mediaempty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;color:var(--muted);gap:6px}.analysisgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.analysisgrid div{padding:10px;border:1px solid var(--line);border-radius:12px;background:#0d0d15}.analysisgrid span{display:block;color:var(--muted);font-size:9px}.analysisgrid strong{display:block;font-size:18px;margin-top:4px}.mediaitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;background:#0d0d15}.mediabadge{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:radial-gradient(circle,#9b70ff,#40237d);font-weight:900}.companionvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.82}.presencepanel{position:relative;overflow:hidden}.presencepanel>.orb,.presencepanel>div:not(.orb):not(video){position:relative;z-index:2}.presencepanel:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,12,21,.92),rgba(13,12,21,.45),rgba(13,12,21,.18));z-index:1;pointer-events:none}
@media(max-width:680px){.analysisgrid{grid-template-columns:1fr 1fr}.mediaitem{grid-template-columns:auto 1fr}.mediaitem .btn,.mediaitem .badge{grid-column:2}}

</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const S={
  page:'home',creatorStep:0,credits:200,freeBeta:true,
  messages:JSON.parse(localStorage.getItem('aurelia.preview.messages')||'[]'),
  memories:JSON.parse(localStorage.getItem('aurelia.preview.memories')||'[]'),
  media:JSON.parse(localStorage.getItem('aurelia.preview.media')||'[]'),
  mediaAnalysis:null,mediaFile:null,previewUrl:null,
  speakReplies:localStorage.getItem('aurelia.preview.speak')!=='false',
  account:JSON.parse(localStorage.getItem('aurelia.preview.account')||'null'),
  avatars:JSON.parse(localStorage.getItem('aurelia.preview.avatars')||'[]'),
  avatar:JSON.parse(localStorage.getItem('aurelia.preview.avatar')||'null'),
  creator:JSON.parse(localStorage.getItem('aurelia.preview.creator')||'null')||{
    name:'',age:18,appearance:'',hair:'',eyes:'',build:'',wardrobe:'',
    warmth:70,directness:65,playfulness:65,initiative:60,calm:70,humor:60,
    cadence:'',voice:'warm',tier:'essential'
  },
  vr:new URLSearchParams(location.search).get('vr')==='1',
  runtime:{state:'idle_neutral',selections:0,unique:0,repeats:0}
};
if(!S.avatars.length&&S.avatar)S.avatars=[S.avatar];
if(!S.avatar&&S.avatars.length)S.avatar=S.avatars[0];
const app=document.querySelector('#app');
function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t){const n=document.querySelector('#toast');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2200)}
function save(){localStorage.setItem('aurelia.preview.creator',JSON.stringify(S.creator));localStorage.setItem('aurelia.preview.messages',JSON.stringify(S.messages));localStorage.setItem('aurelia.preview.memories',JSON.stringify(S.memories));localStorage.setItem('aurelia.preview.media',JSON.stringify(S.media));localStorage.setItem('aurelia.preview.speak',String(S.speakReplies));if(S.account)localStorage.setItem('aurelia.preview.account',JSON.stringify(S.account));localStorage.setItem('aurelia.preview.avatars',JSON.stringify(S.avatars));if(S.avatar)localStorage.setItem('aurelia.preview.avatar',JSON.stringify(S.avatar))}
function nav(page){S.page=page;render()}
function layout(body,title='Aurelia',eyebrow='Beta Launcher'){
  const links=[['home','Home'],['companion','Companion'],['create','Create'],['media','Media'],['runtime','Runtime'],['library','Library'],['account','Account']];
  return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">A</div><span><strong>AURELIA</strong><small>Private Beta · V0.9</small></span></div><nav class="nav">${links.map(([p,l])=>`<button data-nav="${p}" class="${S.page===p?'active':''}"><span>${({home:'◇',companion:'✺',create:'✦',media:'▤',runtime:'◌',library:'▣',account:'○'})[p]}</span> <span class="label">${l}</span></button>`).join('')}</nav><div class="sidebar-foot"><div class="devtag"><b>● V0.9 FREE BETA</b><br>Local preview · no paywall</div></div></aside><main class="main"><div class="topbar"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div class="userpill"><div class="dot">${S.account?esc(S.account.email[0].toUpperCase()):'B'}</div><span>${S.account?esc(S.account.email):'Beta user'}</span></div></div>${body}</main><nav class="mobilebar">${links.map(([p,l])=>`<button data-nav="${p}" class="${S.page===p?'active':''}">${({home:'◇',companion:'✺',create:'✦',media:'▤',runtime:'◌',library:'▣',account:'○'})[p]}<br>${l}</button>`).join('')}</nav></div>`
}

function mediaDb(){
 return new Promise((resolve,reject)=>{const r=indexedDB.open('aurelia-preview-media-v08',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('clips'))r.result.createObjectStore('clips',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})
}
async function putMediaBlob(id,blob){const db=await mediaDb();return new Promise((resolve,reject)=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').put({id,blob});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getMediaBlob(id){const db=await mediaDb();return new Promise((resolve,reject)=>{const tx=db.transaction('clips','readonly');const r=tx.objectStore('clips').get(id);r.onsuccess=()=>resolve(r.result?.blob||null);r.onerror=()=>reject(r.error)})}
async function deleteMediaBlob(id){const db=await mediaDb();return new Promise((resolve,reject)=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function once(el,event){return new Promise((resolve,reject)=>{const ok=()=>{clean();resolve()};const bad=()=>{clean();reject(Error('Media load failed.'))};const clean=()=>{el.removeEventListener(event,ok);el.removeEventListener('error',bad)};el.addEventListener(event,ok,{once:true});el.addEventListener('error',bad,{once:true})})}
async function seek(v,t){const p=once(v,'seeked');v.currentTime=Math.max(0,Math.min(t,Math.max(0,v.duration-.02)));await p}
function frame(v,w=140){const h=Math.max(1,Math.round(w*(v.videoHeight/v.videoWidth||9/16)));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);return x.getImageData(0,0,w,h)}
function diffFrames(a,b){let total=0,n=0;for(let i=0;i<Math.min(a.data.length,b.data.length);i+=4){total+=Math.abs(a.data[i]-b.data[i])+Math.abs(a.data[i+1]-b.data[i+1])+Math.abs(a.data[i+2]-b.data[i+2]);n+=3}return n?total/(n*255):1}
async function analyzeLoop(file){const url=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.preload='auto';v.src=url;try{await once(v,'loadedmetadata');const edge=Math.min(.12,Math.max(.03,v.duration*.025));await seek(v,edge);const a=frame(v);await seek(v,Math.max(edge,v.duration-edge));const b=frame(v);const d=diffFrames(a,b),score=Math.round(Math.max(0,Math.min(100,(1-d)*100)));const grade=score>=92?'A':score>=84?'B':score>=72?'C':score>=58?'D':'F';return{duration:Number(v.duration.toFixed(2)),width:v.videoWidth,height:v.videoHeight,score,grade}}finally{URL.revokeObjectURL(url)}}
async function playLocalMedia(id,target='media-player'){const blob=await getMediaBlob(id);if(!blob){toast('Clip is not stored on this device.');return}if(S.previewUrl)URL.revokeObjectURL(S.previewUrl);S.previewUrl=URL.createObjectURL(blob);const v=document.querySelector('#'+target);if(v){v.src=S.previewUrl;v.loop=true;v.muted=true;v.playsInline=true;await v.play().catch(()=>{})}}
function bestClip(state){const pool=S.media.filter(x=>!x.avatarId||x.avatarId===S.avatar?.id);return pool.find(x=>x.state===state)||pool.find(x=>x.family==='performance')||null}

function home(){
  return layout(`<div class="grid"><section class="card hero glow span8"><div class="herocopy"><span class="badge purple">${S.avatar?'CHARACTER PACKAGE READY':'SELF-SERVICE BETA'}</span><h1>${S.avatar?esc(S.avatar.name):'Create a presence.<br>Build a world.'}</h1><p class="muted">${S.avatar?'Your avatar identity is stored on this device in preview mode. The production build will use the same account across phone, desktop and VR.':'This launcher is the polished device-side preview of the platform we are building. Nothing is pre-populated: create your avatar through the client.'}</p><div class="actions"><button class="btn primary" data-nav="${S.avatar?'companion':'create'}">${S.avatar?'Talk now':'Create avatar'}</button><button class="btn secondary" id="vr-launch">VR Launcher</button></div></div></section>
  <section class="card span4"><div class="cardhead"><h2>Beta Access</h2><span class="badge good">ALL FREE</span></div><div class="stat">∞</div><div class="statlabel">no paywall during beta</div><div class="list" style="margin-top:12px"><div class="row"><div><strong>Avatar slots</strong><div class="meta">${S.avatars.length} used</div></div><b>${4-S.avatars.length} open</b></div><div class="row"><div><strong>Commission tiers</strong><div class="meta">all unlocked</div></div><b>Free</b></div></div></section>
  <section class="card span4"><div class="cardhead"><h2>Phone / Desktop</h2><span class="badge good">READY</span></div><div class="stat">1</div><div class="statlabel">shared client shell</div><p class="muted small">Responsive UI adapts from mobile to full desktop without changing avatar identity.</p></section>
  <section class="card span4"><div class="cardhead"><h2>VR</h2><span class="badge purple">LAUNCHER</span></div><div class="stat">6DoF</div><div class="statlabel">future runtime target</div><p class="muted small">Bookmark the hosted launcher on Quest. Production will authenticate and pull VR-compatible assets from the same account.</p></section>
  <section class="card span4"><div class="cardhead"><h2>Performance</h2><span class="badge good">ENGINE</span></div><div class="stat">Anti-repeat</div><div class="statlabel">transition-aware selection</div><p class="muted small">Designed to avoid the obvious six-loop problem from Alpha.</p></section><section class="card span4"><div class="cardhead"><h2>Provider Bridge</h2><span class="badge purple">V0.9</span></div><div class="stat">Server-side</div><div class="statlabel">AI + video generation adapters</div><p class="muted small">The static launcher remains private/local. Real provider keys live only in the full-stack server build.</p></section></div>`,'Your companion, everywhere.','Persistent AI Avatar Platform')
}
const steps=['Identity','Appearance','Personality','Cadence','Voice','Commission'];
function stepbar(){return `<div class="steps">${steps.map((x,i)=>`<div class="step ${i===S.creatorStep?'active':''} ${i<S.creatorStep?'done':''}"><i>${i<S.creatorStep?'✓':i+1}</i><small>${x}</small></div>`).join('')}</div>`}
function slider(k,l){return `<div class="trait"><div class="traittop"><span>${l}</span><b id="v-${k}">${S.creator[k]}</b></div><input data-range="${k}" type="range" min="0" max="100" value="${S.creator[k]}"></div>`}
function create(){
 let body='';
 if(S.creatorStep===0)body=`<div class="eyebrow">01 · Identity</div><h2>Start with who they are.</h2><p class="muted">Avatar age cannot be lower than 18.</p><div class="formgrid"><div><label>Name</label><input id="c-name" value="${esc(S.creator.name)}" placeholder="Name your avatar"></div><div><label>Age</label><input id="c-age" type="number" min="18" value="${S.creator.age}"></div></div><label class="check"><input type="checkbox" id="adult">Adult-capable profile requested after account verification</label>`;
 if(S.creatorStep===1)body=`<div class="eyebrow">02 · Appearance</div><h2>Design the visual identity.</h2><label>Overall description</label><textarea id="c-appearance" placeholder="Describe the look, aesthetic and presence...">${esc(S.creator.appearance)}</textarea><div class="formgrid"><div><label>Hair</label><input id="c-hair" value="${esc(S.creator.hair)}"></div><div><label>Eyes</label><input id="c-eyes" value="${esc(S.creator.eyes)}"></div><div><label>Build</label><input id="c-build" value="${esc(S.creator.build)}"></div><div><label>Wardrobe aesthetic</label><input id="c-wardrobe" value="${esc(S.creator.wardrobe)}"></div></div><div class="notice" style="margin-top:14px">Reference-image import will use a private rights-attested pipeline in the production backend.</div>`;
 if(S.creatorStep===2)body=`<div class="eyebrow">03 · Personality</div><h2>Give the avatar behavioral DNA.</h2><div class="traits">${slider('warmth','Warmth')}${slider('directness','Directness')}${slider('playfulness','Playfulness')}${slider('initiative','Initiative')}${slider('calm','Calm')}${slider('humor','Humor')}</div>`;
 if(S.creatorStep===3)body=`<div class="eyebrow">04 · Cadence</div><h2>Shape how the avatar communicates.</h2><p class="muted">Use writing you have the right to use, or leave this blank and design cadence later.</p><label>Optional authorized writing excerpt</label><textarea id="c-cadence" placeholder="Paste a cadence sample...">${esc(S.creator.cadence)}</textarea><label class="check"><input type="checkbox" id="cad-rights">I have the right to use this writing sample.</label>`;
 if(S.creatorStep===4)body=`<div class="eyebrow">05 · Voice</div><h2>Choose the delivery direction.</h2><label>Voice style</label><select id="c-voice">${['warm','calm','bright','deep','playful','measured'].map(x=>`<option ${S.creator.voice===x?'selected':''}>${x}</option>`).join('')}</select><div class="notice" style="margin-top:14px">This is a voice profile only. Voice-cloning is not enabled in this preview.</div>`;
 if(S.creatorStep===5)body=`<div class="eyebrow">06 · Commission</div><h2>Build the first performance blueprint.</h2><div class="librarygrid">${[['essential','Essential','12 performance · 4 bridges','120'],['presence','Presence','36 performance · 12 bridges','420'],['immersive','Immersive','72 performance · 24 bridges','900']].map(([id,n,d,c])=>`<button class="tile" data-tier="${id}" style="text-align:left;color:inherit;${S.creator.tier===id?'border-color:#9c6cff;box-shadow:0 0 0 2px rgba(156,108,255,.08)':''}"><strong>${n}</strong><span>${d}</span><p class="muted small">FREE BETA · nominal ${c} credits later</p></button>`).join('')}</div><div class="success" style="margin-top:14px">All tiers are unlocked during beta. Preview commissioning creates the character package locally; external media generation is not being faked.</div>`;
 const foot=`<div class="actions" style="justify-content:space-between;margin-top:20px"><button class="btn secondary" id="c-back" ${S.creatorStep===0?'disabled':''}>← Back</button><button class="btn primary" id="${S.creatorStep===5?'c-commission':'c-next'}">${S.creatorStep===5?'Commission package':'Continue →'}</button></div>`;
 return layout(`<section class="card span12">${stepbar()}<div style="padding-top:24px">${body}${foot}</div></section>`,'Avatar Creator','Official Client · Self-Service')
}

function companion(){
 if(!S.avatar)return layout(`<section class="card glow"><h2>Create an avatar first.</h2><p class="muted">Companion mode appears after you commission a character through the client.</p><button class="btn primary" data-nav="create">Open Creator</button></section>`,'Companion','Conversation · Presence');
 const rows=S.messages.map(m=>`<div class="chatrow ${m.role==='user'?'mine':''}"><div class="chatbubble"><small>${m.role==='user'?'You':esc(S.avatar.name)}</small>${esc(m.text)}<time>${new Date(m.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</time></div></div>`).join('');
 return layout(`<div class="grid"><section class="card glow span8"><div class="presencepanel"><video id="companion-player" class="companionvideo" muted playsinline loop></video><div class="orb">A</div><div><span class="badge good">LIVE · FREE BETA</span><h2 style="margin-top:8px">${esc(S.avatar.name)}</h2><p class="muted small">${esc(S.runtime.state.replaceAll('_',' '))}</p></div></div><div class="chatlog" id="chatlog">${rows||'<div class="muted" style="text-align:center;padding:70px 18px">Start the first conversation. This preview uses local personality logic; the V0.9 full-stack build can connect server-side AI and visual providers to this same surface.</div>'}</div><form id="chat-form" class="chatcompose"><textarea id="chat-input" maxlength="2000" placeholder="Talk to ${esc(S.avatar.name)}..."></textarea><button class="btn primary" type="submit">Send</button></form></section><section class="card span4"><div class="cardhead"><h2>Presence</h2><span class="badge purple">UNLIMITED</span></div><label class="check"><input type="checkbox" id="speak" ${S.speakReplies?'checked':''}>Speak replies on this device</label><div class="list"><div class="row"><span>Memory facts</span><b>${S.memories.length}</b></div><div class="row"><span>Performance state</span><b>${esc(S.runtime.state)}</b></div><div class="row"><span>AI provider</span><b>Local beta</b></div></div><div class="actions" style="margin-top:14px"><button id="notify" class="btn secondary">Test notification</button><button id="clear-chat" class="btn ghost">Clear chat</button></div>${S.memories.length?`<div class="notice" style="margin-top:14px"><b>Explicit memory:</b><br>${S.memories.slice(-5).map(esc).join('<br>')}</div>`:''}</section></div>`,'${esc(S.avatar.name)}','Companion · Free Beta')
}
function localDirector(message){
 const t=message.toLowerCase();
 let state='speak_calm';
 if(/\?|why|how|wonder|curious/.test(t))state='listen_curious';
 else if(/haha|lol|funny|joke|laugh/.test(t))state='react_amused';
 else if(/stress|rough|bad|sad|upset|worry/.test(t))state='react_concerned';
 else if(/great|good|love|happy|excited/.test(t))state='speak_warm';
 else if(/plan|build|next|focus|work|goal/.test(t))state='speak_confident';
 const remember=message.match(/(?:^|\b)(?:please\s+)?remember(?:\s+that)?\s+(.+)/i);
 if(remember&&remember[1]){const fact=remember[1].trim().slice(0,240);if(!S.memories.includes(fact))S.memories.push(fact)}
 let reply='I’m with you. ';
 if(/what do you remember|remember about me|memory/.test(t))reply+=S.memories.length?`Here’s what you explicitly asked me to keep in mind: ${S.memories.slice(-5).join('; ')}.`:'You haven’t explicitly asked me to remember anything yet.';
 else if(/^(hi|hello|hey|yo)\b/.test(t))reply+='Good to see you. What do you feel like talking about?';
 else if(/what should we do|what next|next move/.test(t))reply+='Give me the outcome you want, and I’ll keep the next move focused.';
 else if(remember)reply+='I saved that as an explicit memory for this avatar.';
 else reply+=`You said, “${message.slice(0,160)}” — where do you want to take that next?`;
 return {reply,state}
}


function media(){
 if(!S.avatar)return layout(`<section class="card glow"><h2>Create an avatar first.</h2><p class="muted">Media Studio attaches real loops to the avatar package.</p><button class="btn primary" data-nav="create">Open Creator</button></section>`,'Media Studio','V0.9 · Local Loop Lab');
 const a=S.mediaAnalysis,f=S.mediaFile;
 const activeMedia=S.media.filter(x=>!x.avatarId||x.avatarId===S.avatar.id);
 return layout(`<div class="grid"><section class="card glow span8"><div class="cardhead"><div><h2>Loop importer</h2><p class="muted small">Import a beta clip, analyze the first/last frame seam and tag the runtime state.</p></div><span class="badge purple">DEVICE LOCAL</span></div><div class="mediastage"><video id="media-player" muted playsinline loop></video><div class="mediaempty"><strong>${S.media.length?'Choose Play below':'No clips imported yet'}</strong><span>Files remain on this browser/device in the static launcher.</span></div></div><div class="mediaimport" style="margin-top:14px"><div><label>Video clip</label><input id="m-file" type="file" accept="video/*">${f?`<div class="meta" style="margin-top:5px">${esc(f.name)} · ${(f.size/1024/1024).toFixed(1)} MB</div>`:''}</div><div class="formgrid"><div><label>State</label><select id="m-state">${['idle_neutral','idle_warm','listen_engaged','listen_curious','speak_calm','speak_warm','speak_confident','speak_playful','think_reflective','react_amused','react_concerned'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Family</label><select id="m-family"><option>performance</option><option>transition</option></select></div></div>${a?`<div class="analysisgrid"><div><span>Grade</span><strong>${a.grade}</strong></div><div><span>Seam score</span><strong>${a.score}</strong></div><div><span>Duration</span><strong>${a.duration}s</strong></div><div><span>Resolution</span><strong>${a.width}×${a.height}</strong></div></div>`:'<div class="notice">Choose a clip and the launcher will measure its beginning/end-frame match.</div>'}<div class="actions"><button id="m-analyze" class="btn secondary" ${f?'':'disabled'}>Analyze</button><button id="m-save" class="btn primary" ${f&&a?'':'disabled'}>Save loop</button></div></div></section><section class="card span4"><div class="cardhead"><h2>Library</h2><span class="badge good">${activeMedia.length} CLIPS</span></div><div class="list">${activeMedia.length?activeMedia.map(x=>`<div class="mediaitem"><div class="mediabadge">${x.grade||'▶'}</div><div><strong>${esc(x.name)}</strong><div class="meta">${esc(x.state.replaceAll('_',' '))} · seam ${x.score}</div></div><button class="btn secondary" data-m-play="${x.id}">Play</button><button class="btn ghost" data-m-delete="${x.id}">Remove</button></div>`).join(''):'<p class="muted">No media yet.</p>'}</div></section></div>`,'Media Studio',`${esc(S.avatar.name)} · Performance Library`)
}

function runtime(){
 if(!S.avatar)return layout(`<section class="card glow"><h2>Commission an avatar first.</h2><p class="muted">The runtime stays empty until the user builds a character through the client.</p><button class="btn primary" data-nav="create">Open Creator</button></section>`,'Performance Runtime','Transition Engine');
 return layout(`<div class="grid"><section class="card glow span8"><div class="cardhead"><div><h2>${esc(S.avatar.name)} · Presence Runtime</h2><p class="muted small">Metadata simulation now; generated loops plug into the same engine later.</p></div><span class="badge good">ONLINE</span></div><div class="runtimebox"><div class="orb">A</div><div class="wave">${Array.from({length:32},(_,i)=>`<b style="animation-delay:${(i%7)*.08}s"></b>`).join('')}</div></div><div class="actions" style="margin-top:14px">${['idle_neutral','listen_engaged','speak_warm','think_reflective','react_amused'].map(x=>`<button class="btn secondary" data-state="${x}">${x.replaceAll('_',' ')}</button>`).join('')}</div></section><section class="card span4"><div class="cardhead"><h2>Session state</h2><span class="badge purple">${esc(S.runtime.state)}</span></div><div class="stat">${S.runtime.selections}</div><div class="statlabel">performance selections</div><div class="list" style="margin-top:12px"><div class="row"><span>Unique</span><b>${S.runtime.unique}</b></div><div class="row"><span>Immediate repeats</span><b>${S.runtime.repeats}</b></div><div class="row"><span>Mode</span><b>Local-first</b></div></div><button id="stress" class="btn primary full" style="margin-top:12px">Stress test 60 selections</button></section></div>`,'Performance Runtime','Continuity · Anti-Repeat')
}
function library(){
 const activeMedia=S.media.filter(x=>!x.avatarId||x.avatarId===S.avatar?.id);
 return layout(`<div class="grid"><section class="card span8"><div class="cardhead"><h2>Your avatars</h2><span class="badge">${S.avatars.length} / 4</span></div>${S.avatars.length?`<div class="list">${S.avatars.map(a=>`<div class="row"><div><strong>${esc(a.name)} ${S.avatar?.id===a.id?'<span class="badge good">ACTIVE</span>':''}</strong><div class="meta">Age ${a.age} · ${a.tier} · ${S.media.filter(x=>x.avatarId===a.id).length} clips</div></div>${S.avatar?.id===a.id?'':`<button class="btn secondary" data-use-avatar="${a.id}">Use</button>`}</div>`).join('')}</div>`:'<p class="muted">No avatars yet.</p>'}</section><section class="card span4"><h2>Active package</h2>${S.avatar?`<div class="stat">${esc(S.avatar.name)}</div><div class="statlabel">${activeMedia.length} local media clips</div><button class="btn primary full" data-nav="companion" style="margin-top:14px">Open Companion</button>`:'<p class="muted">Create an avatar first.</p>'}</section></div>`,'Library','Avatar Packages · Four Free Beta Slots')
}
function account(){
 return layout(`<div class="grid"><section class="card span6"><h2>Beta account</h2><label>Email</label><input id="acct-email" value="${esc(S.account?.email||'jay.beta@example.com')}"><div class="actions" style="margin-top:14px"><button class="btn primary" id="save-acct">Save local account</button></div></section><section class="card span6"><div class="cardhead"><h2>Free Beta</h2><span class="badge good">NO PAYWALL</span></div><p class="muted small">This launcher stores test data locally. Production will use server-side identity, isolated cloud storage and account recovery.</p><div class="row"><span>Avatar age floor</span><b>18+</b></div><div class="row"><span>Avatar slots</span><b>${S.avatars.length} used / 4 free</b></div><div class="row"><span>Commission tiers</span><b>Unlocked</b></div><div class="row"><span>Companion</span><b>Unlimited beta</b></div></section></div>`,'Account','Private Beta')
}
function vr(){
 document.body.classList.add('vrmode');
 app.innerHTML=`<main class="main"><div class="vrhero"><section><div class="eyebrow">Quest / VR Launcher</div><h1>${S.avatar?esc(S.avatar.name):'Aurelia Platform'}</h1><p class="muted">This URL can be bookmarked as the VR launcher. The production VR client will authenticate the same account and download only the headset-compatible portion of the avatar package.</p><div class="actions"><button class="btn primary" id="vr-enter">${S.avatar?'Enter avatar space':'Create on phone/desktop first'}</button><button class="btn secondary" id="vr-exit">Exit VR preview</button></div></section><section class="runtimebox" style="min-height:70vh"><div class="orb">A</div><div class="wave">${Array.from({length:38},(_,i)=>`<b style="animation-delay:${(i%9)*.06}s"></b>`).join('')}</div></section></div></main>`;
 document.querySelector('#vr-exit').onclick=()=>{history.replaceState({},'',location.pathname);S.vr=false;document.body.classList.remove('vrmode');render()};
 document.querySelector('#vr-enter').onclick=()=>toast(S.avatar?'VR runtime shell ready — media pack not generated yet.':'Create an avatar first.');
}
function render(){
 if(S.vr)return vr();
 document.body.classList.remove('vrmode');
 if(S.page==='companion')app.innerHTML=companion();
 else if(S.page==='create')app.innerHTML=create();
 else if(S.page==='media')app.innerHTML=media();
 else if(S.page==='runtime')app.innerHTML=runtime();
 else if(S.page==='library')app.innerHTML=library();
 else if(S.page==='account')app.innerHTML=account();
 else app.innerHTML=home();
 bind();
}
function capture(){
 if(S.creatorStep===0){
  const n=document.querySelector('#c-name');const a=document.querySelector('#c-age');
  if(n){S.creator.name=n.value.trim();S.creator.age=Number(a.value||18);if(S.creator.age<18)throw Error('Avatar age must be 18 or older.')}
 } else if(S.creatorStep===1){
  S.creator.appearance=document.querySelector('#c-appearance').value.trim();S.creator.hair=document.querySelector('#c-hair').value.trim();S.creator.eyes=document.querySelector('#c-eyes').value.trim();S.creator.build=document.querySelector('#c-build').value.trim();S.creator.wardrobe=document.querySelector('#c-wardrobe').value.trim();
 } else if(S.creatorStep===3){
  const text=document.querySelector('#c-cadence').value; if(text.trim()&&!document.querySelector('#cad-rights').checked)throw Error('Confirm rights to use the writing sample.');S.creator.cadence=text.trim();
 } else if(S.creatorStep===4){S.creator.voice=document.querySelector('#c-voice').value}
 save();
}
function bind(){
 document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>nav(x.dataset.nav));
 document.querySelector('#vr-launch')?.addEventListener('click',()=>{S.vr=true;history.replaceState({},'',location.pathname+'?vr=1');render()});
 document.querySelector('#c-next')?.addEventListener('click',()=>{try{capture();S.creatorStep=Math.min(5,S.creatorStep+1);save();render()}catch(e){toast(e.message)}});
 document.querySelector('#c-back')?.addEventListener('click',()=>{try{capture()}catch{}S.creatorStep=Math.max(0,S.creatorStep-1);render()});
 document.querySelectorAll('[data-range]').forEach(x=>x.oninput=()=>{S.creator[x.dataset.range]=Number(x.value);document.querySelector('#v-'+x.dataset.range).textContent=x.value;save()});
 document.querySelectorAll('[data-tier]').forEach(x=>x.onclick=()=>{S.creator.tier=x.dataset.tier;save();render()});
 document.querySelector('#c-commission')?.addEventListener('click',()=>{try{capture();if(!S.creator.name)throw Error('Add an avatar name first.');if(S.creator.age<18)throw Error('Avatar age must be 18 or older.');if(S.avatars.length>=4)throw Error('All four free beta avatar slots are already used.');S.avatar={id:'avatar_'+Date.now(),name:S.creator.name,age:S.creator.age,tier:S.creator.tier,createdAt:new Date().toISOString()};S.avatars.push(S.avatar);save();localStorage.setItem('aurelia.preview.avatar',JSON.stringify(S.avatar));S.page='home';toast(`${S.avatar.name} commissioned locally.`);render()}catch(e){toast(e.message)}});


 document.querySelector('#m-file')?.addEventListener('change',async e=>{S.mediaFile=e.target.files?.[0]||null;S.mediaAnalysis=null;if(S.mediaFile){try{S.mediaAnalysis=await analyzeLoop(S.mediaFile)}catch(err){toast(err.message)}}render()});
 document.querySelector('#m-analyze')?.addEventListener('click',async()=>{if(!S.mediaFile)return;try{S.mediaAnalysis=await analyzeLoop(S.mediaFile);render()}catch(e){toast(e.message)}});
 document.querySelector('#m-save')?.addEventListener('click',async()=>{if(!S.mediaFile||!S.mediaAnalysis)return;const id='media_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);await putMediaBlob(id,S.mediaFile);S.media.push({id,avatarId:S.avatar.id,name:S.mediaFile.name,state:document.querySelector('#m-state').value,family:document.querySelector('#m-family').value,grade:S.mediaAnalysis.grade,score:S.mediaAnalysis.score,duration:S.mediaAnalysis.duration,width:S.mediaAnalysis.width,height:S.mediaAnalysis.height});S.mediaFile=null;S.mediaAnalysis=null;save();render();requestAnimationFrame(()=>playLocalMedia(id))});
 document.querySelectorAll('[data-m-play]').forEach(b=>b.onclick=()=>playLocalMedia(b.dataset.mPlay));
 document.querySelectorAll('[data-m-delete]').forEach(b=>b.onclick=async()=>{await deleteMediaBlob(b.dataset.mDelete);S.media=S.media.filter(x=>x.id!==b.dataset.mDelete);save();render()});


 document.querySelectorAll('[data-use-avatar]').forEach(b=>b.onclick=()=>{const a=S.avatars.find(x=>x.id===b.dataset.useAvatar);if(a){S.avatar=a;save();toast(`${a.name} is now active.`);render()}});

 document.querySelector('#chat-form')?.addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#chat-input');const msg=input.value.trim();if(!msg)return;const at=new Date().toISOString();S.messages.push({role:'user',text:msg,at});const out=localDirector(msg);S.runtime.state=out.state;S.runtime.selections++;S.messages.push({role:'assistant',text:out.reply,at:new Date().toISOString()});save();if(S.speakReplies&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(out.reply);u.rate=1;speechSynthesis.speak(u)}render();requestAnimationFrame(async()=>{const l=document.querySelector('#chatlog');if(l)l.scrollTop=l.scrollHeight;const clip=bestClip(out.state);if(clip)await playLocalMedia(clip.id,'companion-player')})});
 document.querySelector('#speak')?.addEventListener('change',e=>{S.speakReplies=e.target.checked;save()});
 document.querySelector('#clear-chat')?.addEventListener('click',()=>{S.messages=[];save();render()});
 document.querySelector('#notify')?.addEventListener('click',async()=>{if(!('Notification'in window)){toast('Notifications are not supported here.');return;}const p=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(p==='granted')new Notification(S.avatar?.name||'Aurelia',{body:`${S.avatar?.name||'Your avatar'} is ready when you are.`});else toast('Notification permission not granted.')});

 document.querySelectorAll('[data-state]').forEach(x=>x.onclick=()=>{const prev=S.runtime.state;S.runtime.state=x.dataset.state;S.runtime.selections++;S.runtime.unique++;if(prev===S.runtime.state)S.runtime.repeats++;render()});
 document.querySelector('#stress')?.addEventListener('click',()=>{S.runtime.selections+=60;S.runtime.unique+=Math.min(52,60);S.runtime.repeats+=0;toast('60-selection anti-repeat simulation complete.');render()});
 document.querySelector('#save-acct')?.addEventListener('click',()=>{S.account={email:document.querySelector('#acct-email').value.trim()};save();toast('Local beta account saved.');render()});
}
const openPage=new URLSearchParams(location.search).get('open');if(['home','companion','create','media','runtime','library','account'].includes(openPage))S.page=openPage;
render();
</script>
