<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nocturne Matrix</title><link rel="stylesheet" href="/matrix.css"><script type="module" src="/matrix.js"></script></head><body><canvas id="matrix"></canvas><header><a href="/">NOCTURNE</a><span>MATRIX · NWE-2</span><button id="start">Chart Start</button></header><aside><b id="mode">IDLE</b><span id="readout">speed 0 · intensity 0 · shock 0</span></aside><dialog id="chart"><form method="dialog" id="form"><h2>Chart Start</h2><p>THC/alcohol are user-reported session context. They are not impairment measurements and do not automatically increase intensity.</p><div class="grid"><label>Mood<select id="mood"><option>calm</option><option>focused</option><option>energized</option><option>stressed</option></select></label><label>Energy<input id="energy" type="range" min="0" max="10" value="6"></label><label>Baseline discomfort<input id="discomfort" type="range" min="0" max="10" value="1"></label><label>Entry speed<input id="entrySpeed" type="number" min=".2" max="20" step=".1" value="6"></label><label>Depth<input id="depth" type="range" min="0" max="100" value="50"></label><label>Cycle time<input id="cycleTime" type="number" min=".2" max="20" step=".1" value="5.9"></label><label>Force<input id="force" type="range" min="0" max="100" value="40"></label><label>Rhythm<select id="rhythm"><option>steady</option><option>variable</option><option>syncopated</option></select></label></div><div class="context"><label><input id="thc" type="checkbox"> THC context</label><input id="thcLevel" type="range" min="0" max="10" value="0"><label><input id="alcohol" type="checkbox"> Alcohol context</label><input id="alcoholLevel" type="range" min="0" max="10" value="0"></div><h3>Matrix response</h3><div class="grid"><label>Motion<input id="motion" type="range" min="0" max="100" value="40"></label><label>Complexity<input id="complexity" type="range" min="0" max="100" value="55"></label><label>Telemetry<input id="telemetry" type="range" min="0" max="100" value="65"></label><label>Flash<input id="flash" type="range" min="0" max="25" value="5"></label></div><label><input id="safe" type="checkbox"> Photosensitive safe mode</label><menu><button value="cancel">Cancel</button><button value="default">Begin Session</button></menu></form></dialog><section id="controls"><label>Speed<input id="speed" type="range" min="0" max="100" value="20"></label><label>Intensity<input id="intensity" type="range" min="0" max="100" value="20"></label><label>Pleasure<input id="pleasure" type="range" min="0" max="100" value="20"></label><label>Discomfort<input id="liveDiscomfort" type="range" min="0" max="100" value="10"></label><label>Shock<input id="shock" type="range" min="0" max="100" value="0"></label><button id="impulse">Event impulse</button><button id="mic">Mic analysis off</button><button id="export">Export</button></section></body></html>
